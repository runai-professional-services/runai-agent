# Minimal deployment without monitoring or persistence
# Good for: Development, testing, resource-constrained environments

global:
  namespace: "runai-agent-dev"
  deploymentName: "runai-agent-dev"

image:
  repository: ghcr.io/runai-professional-services/runai-agent
  tag: ""  # Uses Chart.appVersion
  pullPolicy: Always

# MCP server — bundled subchart (provides all Run:AI platform operations)
mcp-server-runai:
  enabled: true
  runai:
    baseUrl: "https://myorg.run.ai"
    credentials:
      existingSecret: "runai-creds"  # Secret keys: clientId, clientSecret

# Run:AI credentials for monitoring functions (proactive_monitor, job_analytics)
runai:
  existingSecret: "runai-creds"

nvidia:
  existingSecret: "nvidia-key"

# Disable monitoring sidecar
monitoring:
  enabled: false

# Disable persistence (in-memory only)
failureAnalysis:
  persistence:
    enabled: false

# Minimal resources
resources:
  requests:
    cpu: "1"
    memory: "2Gi"
    gpu: 0
  limits:
    cpu: "2"
    memory: "4Gi"

rbac:
  create: true

