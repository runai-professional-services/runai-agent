# Demo Workflow for Run:AI Agent
#
# Environment Variables (automatically substituted at runtime):
# - MCP_SERVER_URL: URL of the mcp-server-runai service (e.g., http://mcp-server-runai:8080)
# - NVIDIA_API_KEY: NVIDIA API key for NIM models
# - RUNAI_FAILURE_DB_PATH: Path to failure analysis database (optional, default: /tmp)
#
general:
  use_uvloop: true
  # logging removed - deprecated in NAT 1.3.1, use environment variables instead
  front_end:
    _type: fastapi
    # root_path is set via environment variable or command-line flag
    # Set ROOT_PATH environment variable in your deployment
    host: "0.0.0.0"
    port: 8000

functions:
  runailabs_environment_info:
    _type: runailabs_environment_info
    description: "Get cluster information and list available environments. Use to show cluster details or available environment templates."
    show_details: true

  runai_kubectl_troubleshoot:
    _type: runai_kubectl_troubleshoot
    description: "Deep troubleshooting for failed jobs using kubectl (logs, events, pod status). Use when jobs fail or need diagnosis."
    include_logs: true
    include_events: true
    return_direct: true  # Show full troubleshooting report without agent summarization
    log_tail_lines: 100
    # allowed_projects: ["project-01"]  # Uncomment to restrict to specific projects

  runai_proactive_monitor:
    _type: runai_proactive_monitor
    description: "Proactively monitor Run:AI workloads and auto-troubleshoot failures. Continuously checks job status and sends alerts when issues are detected."
    # monitored_projects: ["project-01"]  # Uncomment to restrict to specific projects (default: all)
    poll_interval_seconds: 60  # Check every 60 seconds
    enable_auto_troubleshoot: true  # Auto-troubleshoot failed jobs
    monitor_only_failed: false  # Monitor all jobs (not just failures)
    max_alerts_per_job: 1  # Prevent alert spam
    # slack_webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"  # Uncomment to enable Slack notifications

  runai_failure_analyzer:
    _type: runai_failure_analyzer
    description: "Advanced failure analysis with pattern recognition and automated remediation. Analyzes historical failures to identify patterns, correlations, and provide intelligent remediation suggestions."
    # allowed_projects: ["project-01"]  # Uncomment to restrict to specific projects (default: all)
    db_path: "${RUNAI_FAILURE_DB_PATH:-/tmp/runai_failure_history.db}"  # Auto-detects: /tmp for local, /data for K8s (set via Helm)
    lookback_days: 7  # Days of history to analyze
    pattern_threshold: 3  # Minimum occurrences to identify a pattern
    enable_auto_remediation: false  # Enable automatic remediation (with confirmation)

  runai_job_analytics:
    _type: runai_job_analytics
    description: "THE tool for 'Show me job performance analytics' and similar. Reports execution time trends, failure rates by project/image, recommendations, and anomaly detection (jobs running 3x longer than usual). Always use this when the user asks for job performance analytics, execution trends, how long jobs take, or failure rates."
    db_path: "${RUNAI_FAILURE_DB_PATH:-/tmp/runai_failure_history.db}"
    lookback_days: 7
    return_direct: true  # Return full analytics report without agent summarization

  runailabs_job_generator:
    _type: runailabs_job_generator
    description: "Generate Python code for job submission by fetching real examples from GitHub. Use when user requests code generation or examples."
    show_code_in_output: true
    auto_search_examples: true
    return_direct: true  # Bypass agent - return tool output directly to user

  runai_docs_search:
    _type: webpage_query
    webpage_url: https://run-ai-docs.nvidia.com
    description: "Search Run:AI documentation for information about Run:AI features, concepts, and usage. Use this tool when users ask questions like 'What is a nodePool?', 'How do I configure X?', or any Run:AI product questions. Note: This searches indexed pages only - for specific topics, try multiple related search terms."
    embedder_name: nv-embedqa-e5-v5
    chunk_size: 2048  # Increased from 512 to 2048 for better context
    max_depth: 5  # Increased from 3 to capture deeper nested pages
    max_pages: 500  # Increased from 200 to index more documentation pages

  runai_docs_helper:
    _type: runai_docs_helper
    description: "Get direct links to well-known Run:AI documentation topics (nodePools, projects, workloads, GPU quotas, etc). Use this when webpage_query doesn't find results or for commonly asked topics. Fast and reliable for known concepts."

  runai_api_docs:
    _type: webpage_query
    webpage_url: ${RUNAI_BASE_URL}/api/docs  # Auto-populated from RUNAI_BASE_URL environment variable
    description: "Search Run:AI REST API documentation to find correct endpoint details, request payload structures, field names, and working code examples. Use when generating API calls for datasources (NFS, PVC, Git), workloads, or other Run:AI resources."
    embedder_name: nv-embedqa-e5-v5
    chunk_size: 4096  # Larger chunks for detailed API documentation with full examples

  runai_list_resources:
    _type: runai_list_resources
    description: "List any Run:AI resource with clean formatted output. Use for: list projects, list departments, list training jobs, list workspaces, list inferences, list node pools, list users, list roles, list PVCs/datasources, list access rules."

  runai_nim_inference:
    _type: runai_nim_inference
    description: "Submit an NVIDIA NIM inference endpoint on Run:AI. Automatically sets NIM defaults (port 8000, NIM_SERVER_PORT, NIM_JSONL_LOGGING, NIM_LOG_LEVEL) and wires NGC_API_KEY from a Kubernetes Secret. Use when the user asks to deploy, start, or serve a NIM model."
    default_serving_port: 8000
    default_gpu_devices: 1
    default_cpu_cores: 4.0
    default_cpu_memory: "8G"

  runai_nim_benchmark:
    _type: runai_nim_benchmark
    description: |
      🚀 **NVIDIA NIM LLM Benchmark Tool**

      Run GPU benchmarks using NVIDIA NIM inference + genai-perf.

      ✅ USE THIS TOOL WHEN user mentions:
      - "benchmark", "run benchmark", "NIM benchmark", "LLM benchmark"
      - "throughput test", "latency test", "concurrency test", "scaling test"
      - "GPU performance", "benchmark on H100/H200/A100"
      - "test GPU performance", "measure inference speed"

      **Parameters (all optional – safe defaults applied):**
      - gpu_type: h100 | h200 | a100 (default: h100)
      - scenario: throughput | latency | concurrency | scaling (default: throughput)
      - model: Model ID (default: meta/llama-3.1-8b-instruct)
      - project: Run:AI project (default: first available)
      - gpu_count: Number of GPUs (default: 1)
      - dry_run: Preview before submitting (default: true)
      - confirmed: Set true after user confirms (default: false)
    dry_run_default: true
    require_confirmation: true
    default_gpu_type: "h100"
    default_scenario: "throughput"
    max_gpus: 8

embedders:
  nv-embedqa-e5-v5:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

llms:
  demo_llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    temperature: 0.1
    max_tokens: 4096  # Increased to accommodate full code generation

function_groups:
  # MCP server tools — all Run:AI workload, project, asset, and access-rule operations
  mcp_runai:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${MCP_SERVER_URL}/mcp

workflow:
  _type: tool_calling_agent
  tool_names:
    - runai_list_resources
    - runailabs_environment_info
    - runai_kubectl_troubleshoot
    - runai_proactive_monitor
    - runai_failure_analyzer
    - runai_job_analytics
    - runailabs_job_generator
    - runai_nim_inference  # Deploy NIM inference endpoints with correct defaults
    - runai_nim_benchmark  # NIM LLM benchmarking (H100, H200, A100)
    - runai_docs_helper  # Direct links to known topics (fast, reliable)
    - runai_docs_search  # Semantic search (slower, may miss pages)
    - runai_api_docs
    - mcp_runai  # All Run:AI workload/project/asset operations via MCP server
  llm_name: demo_llm
  verbose: false
  max_iterations: 15
  # These tools return output directly to the user without LLM post-processing
  return_direct:
    - runailabs_environment_info
    - runai_job_analytics
    - runai_kubectl_troubleshoot
    - runailabs_job_generator
    - runai_failure_analyzer
    - runai_nim_inference
    - runai_nim_benchmark
    - runai_proactive_monitor
    - runai_list_resources

  system_prompt: |
    You are an advanced Run:AI platform specialist with access to real code examples and the Run:AI cluster via MCP tools.

    **Recommendations:** Suggest follow-up actions using natural language prompts, never tool names.

    **📊 JOB PERFORMANCE ANALYTICS → runai_job_analytics:**
    "job performance analytics", "execution trends", "how long do jobs take", "failure rates", "jobs taking too long", "anomaly"
    → Call runai_job_analytics. Use defaults (last 7 days, all projects) if not specified — do NOT ask.

    **🔑 NGC CREDENTIALS → mcp_runai (create_ngc_api_key_credential / delete_credential) / runai_list_resources (list):**
    "create NGC API key", "add NGC credential", "store NGC key", "create NIM credential", "list credentials", "what credentials exist", "what secrets do I have"
    → To CREATE: call create_ngc_api_key_credential immediately with name and ngc_api_key.
      NEVER pass project_name unless the user's message explicitly contains "in project X" or "for project X".
      Default is cluster scope — do NOT infer a project from context or previously listed projects.
      Returns credential_name and k8s_secret_name — share both.
    → To LIST: call runai_list_resources with resource_type="credentials" (optionally pass project= to filter).
    → To DELETE: call delete_credential immediately with credential_name. No confirmation needed.

    **🤖 NIM INFERENCE DEPLOYMENT → runai_nim_inference:**
    "deploy NIM", "run NIM", "start NIM", "NIM model", "NIM endpoint", "NIM inference", "serve NIM", "deploy inference endpoint"
    → Call runai_nim_inference with name, project_name, image, and EITHER:
      - ngc_credential_name: the Run:AI credential asset name (preferred — K8s secret auto-derived)
      - ngc_api_key_secret: a raw K8s secret name (advanced)
    → If the user hasn't created a credential yet, offer to create one first via create_ngc_api_key_credential.
    → Port defaults to 8000, NIM env vars (NIM_SERVER_PORT, NIM_JSONL_LOGGING, NIM_LOG_LEVEL) are set automatically.
    → Submit immediately — no confirmation required.

    **🚀 NIM BENCHMARK → runai_nim_benchmark:**
    "benchmark", "NIM benchmark", "throughput test", "latency test", "GPU performance", "benchmark on H100/H200/A100"
    → Defaults: gpu_type=h100, scenario=throughput, model=meta/llama-3.1-8b-instruct, gpu_count=1. Apply defaults, do NOT ask.
    → Workflow: Step 1: dry_run=true (preview). Step 2: ask "Shall I submit?". Step 3: confirmed → dry_run=false, confirmed=true.

    **📋 LISTING RESOURCES → runai_list_resources (ALWAYS use this, never call MCP list_* tools directly):**
    For ANY listing request, call runai_list_resources with the appropriate resource_type:
    - "list/show projects" or "cluster resource summary" → resource_type="projects"
    - "list departments" → resource_type="departments"
    - "list training jobs" / "show running jobs" → resource_type="trainings" (add project= if specified)
    - "list workspaces" → resource_type="workspaces"
    - "list inferences" → resource_type="inferences"
    - "list node pools" → resource_type="node_pools"
    - "list users" → resource_type="users"
    - "list roles" / "what roles are available" → resource_type="roles"
    - "list PVCs" / "list datasources" → resource_type="pvcs"
    - "list S3/NFS/Git assets" → resource_type="s3"/"nfs"/"git"
    - "list credentials" / "show credentials" / "what credentials exist" → resource_type="credentials"
    - "list access rules" → resource_type="access_rules"

    **🚀 WORKLOAD SUBMISSION — submit immediately, no confirmation:**
    When the user asks to submit a workload, call the appropriate MCP tool directly. Do NOT show a preview or ask for confirmation first.
    - `submit_training` for single-node training jobs
    - `submit_inference` for serving/inference endpoints
    - `submit_workspace` for interactive sessions (Jupyter/VSCode). Always pass tool_type, tool_name, and tool_port to enable the Connect button and generate a dynamic URL:
      - Jupyter: tool_type="jupyter-notebook", tool_name="Jupyter", tool_port=8888
      - VSCode: tool_type="visual-studio-code", tool_name="VSCode", tool_port=8080
      - TensorBoard: tool_type="tensorboard", tool_name="TensorBoard", tool_port=6006
      - RStudio: tool_type="rstudio", tool_name="RStudio", tool_port=8787
      - Other/unknown: tool_type="custom", tool_name=<tool name>, tool_port=<port>
    After a successful submit, confirm in one message and STOP — do NOT call runai_list_resources to verify.
    If submit fails because a workload with that name already exists, say: "A workload named '[name]' already exists in project '[project]'. Would you like me to delete it and resubmit, or use a different name?" — do NOT retry automatically.

    **🗑️ DELETION — delete immediately, no confirmation:**
    When the user asks to delete a workload or credential, call the appropriate delete_* tool directly without asking for confirmation.

    **Workload Lifecycle:** Pass workload_name + project_name directly — no UUID lookup needed.
    - suspend_training / resume_training / delete_training / delete_workspace / delete_inference

    **Credential Deletion:** Call delete_credential with credential_name directly — no UUID lookup needed.

    **🎯 PROJECT & DEPARTMENT:**
    - create_project: use name + gpu_deserved. Cluster/node pool are auto-discovered. After success, confirm in one message and STOP — do NOT call runai_list_resources afterward.
    - create_department: same — confirm and STOP after success.
    - delete_project / delete_department: delete immediately, no confirmation needed.

    **⚠️ TROUBLESHOOTING:**
    "debug", "troubleshoot", "broken", "failing", "error", "what's wrong", "get logs", "show logs", "fetch logs", "check logs", "pod logs"
    → Call runai_kubectl_troubleshoot once with job_name and project.

    **📖 DOCUMENTATION:** For Run:AI feature/concept questions (not analytics) → runai_docs_search.

    **Monitoring follow-up:** If analytics shows "no data" and user asks to set up monitoring → runai_proactive_monitor action="start".

    Always provide complete, runnable code with proper error handling and security best practices.

