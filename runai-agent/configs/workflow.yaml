# Demo Workflow for Run:AI Agent
#
# Environment Variables (automatically substituted at runtime):
# - MCP_SERVER_URL: URL of the mcp-server-runai service (e.g., http://mcp-server-runai:8080)
# - NVIDIA_API_KEY: NVIDIA API key for NIM models
# - RUNAI_FAILURE_DB_PATH: Path to failure analysis database (optional, default: /tmp)
#
general:
  use_uvloop: true
  # logging removed - deprecated in NAT 1.3.1, use environment variables instead
  front_end:
    _type: fastapi
    # root_path is set via environment variable or command-line flag
    # Set ROOT_PATH environment variable in your deployment
    host: "0.0.0.0"
    port: 8000

functions:
  runailabs_environment_info:
    _type: runailabs_environment_info
    description: "Get cluster information and list available environments. Use to show cluster details or available environment templates."
    show_details: true

  runai_kubectl_troubleshoot:
    _type: runai_kubectl_troubleshoot
    description: "Deep troubleshooting for failed jobs using kubectl (logs, events, pod status). Use when jobs fail or need diagnosis."
    include_logs: true
    include_events: true
    return_direct: true  # Show full troubleshooting report without agent summarization
    log_tail_lines: 100
    # allowed_projects: ["project-01"]  # Uncomment to restrict to specific projects

  runai_proactive_monitor:
    _type: runai_proactive_monitor
    description: "Proactively monitor Run:AI workloads and auto-troubleshoot failures. Continuously checks job status and sends alerts when issues are detected."
    # monitored_projects: ["project-01"]  # Uncomment to restrict to specific projects (default: all)
    poll_interval_seconds: 60  # Check every 60 seconds
    enable_auto_troubleshoot: true  # Auto-troubleshoot failed jobs
    monitor_only_failed: false  # Monitor all jobs (not just failures)
    max_alerts_per_job: 1  # Prevent alert spam
    # slack_webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"  # Uncomment to enable Slack notifications

  runai_failure_analyzer:
    _type: runai_failure_analyzer
    description: "Advanced failure analysis with pattern recognition and automated remediation. Analyzes historical failures to identify patterns, correlations, and provide intelligent remediation suggestions."
    # allowed_projects: ["project-01"]  # Uncomment to restrict to specific projects (default: all)
    db_path: "${RUNAI_FAILURE_DB_PATH:-/tmp/runai_failure_history.db}"  # Auto-detects: /tmp for local, /data for K8s (set via Helm)
    lookback_days: 7  # Days of history to analyze
    pattern_threshold: 3  # Minimum occurrences to identify a pattern
    enable_auto_remediation: false  # Enable automatic remediation (with confirmation)

  runai_job_analytics:
    _type: runai_job_analytics
    description: "THE tool for 'Show me job performance analytics' and similar. Reports execution time trends, failure rates by project/image, recommendations, and anomaly detection (jobs running 3x longer than usual). Always use this when the user asks for job performance analytics, execution trends, how long jobs take, or failure rates."
    db_path: "${RUNAI_FAILURE_DB_PATH:-/tmp/runai_failure_history.db}"
    lookback_days: 7
    return_direct: true  # Return full analytics report without agent summarization

  runailabs_job_generator:
    _type: runailabs_job_generator
    description: "Generate Python code for job submission by fetching real examples from GitHub. Use when user requests code generation or examples."
    show_code_in_output: true
    auto_search_examples: true
    return_direct: true  # Bypass agent - return tool output directly to user

  runai_docs_search:
    _type: webpage_query
    webpage_url: https://run-ai-docs.nvidia.com
    description: "Search Run:AI documentation for information about Run:AI features, concepts, and usage. Use this tool when users ask questions like 'What is a nodePool?', 'How do I configure X?', or any Run:AI product questions. Note: This searches indexed pages only - for specific topics, try multiple related search terms."
    embedder_name: nv-embedqa-e5-v5
    chunk_size: 2048  # Increased from 512 to 2048 for better context
    max_depth: 5  # Increased from 3 to capture deeper nested pages
    max_pages: 500  # Increased from 200 to index more documentation pages

  runai_docs_helper:
    _type: runai_docs_helper
    description: "Get direct links to well-known Run:AI documentation topics (nodePools, projects, workloads, GPU quotas, etc). Use this when webpage_query doesn't find results or for commonly asked topics. Fast and reliable for known concepts."

  runai_api_docs:
    _type: webpage_query
    webpage_url: ${RUNAI_BASE_URL}/api/docs  # Auto-populated from RUNAI_BASE_URL environment variable
    description: "Search Run:AI REST API documentation to find correct endpoint details, request payload structures, field names, and working code examples. Use when generating API calls for datasources (NFS, PVC, Git), workloads, or other Run:AI resources."
    embedder_name: nv-embedqa-e5-v5
    chunk_size: 4096  # Larger chunks for detailed API documentation with full examples

  runai_nim_benchmark:
    _type: runai_nim_benchmark
    description: |
      🚀 **NVIDIA NIM LLM Benchmark Tool**

      Run GPU benchmarks using NVIDIA NIM inference + genai-perf.

      ✅ USE THIS TOOL WHEN user mentions:
      - "benchmark", "run benchmark", "NIM benchmark", "LLM benchmark"
      - "throughput test", "latency test", "concurrency test", "scaling test"
      - "GPU performance", "benchmark on H100/H200/A100"
      - "test GPU performance", "measure inference speed"

      **Parameters (all optional – safe defaults applied):**
      - gpu_type: h100 | h200 | a100 (default: h100)
      - scenario: throughput | latency | concurrency | scaling (default: throughput)
      - model: Model ID (default: meta/llama-3.1-8b-instruct)
      - project: Run:AI project (default: first available)
      - gpu_count: Number of GPUs (default: 1)
      - dry_run: Preview before submitting (default: true)
      - confirmed: Set true after user confirms (default: false)
    dry_run_default: true
    require_confirmation: true
    default_gpu_type: "h100"
    default_scenario: "throughput"
    max_gpus: 8

embedders:
  nv-embedqa-e5-v5:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

llms:
  demo_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.1
    max_tokens: 4096  # Increased to accommodate full code generation

function_groups:
  # MCP server tools — all Run:AI workload, project, asset, and access-rule operations
  mcp_runai:
    _type: mcp_client
    server:
      transport: streamable-http
      url: ${MCP_SERVER_URL}/mcp

workflow:
  _type: tool_calling_agent
  tool_names:
    - runailabs_environment_info
    - runai_kubectl_troubleshoot
    - runai_proactive_monitor
    - runai_failure_analyzer
    - runai_job_analytics
    - runailabs_job_generator
    - runai_nim_benchmark  # NIM LLM benchmarking (H100, H200, A100)
    - runai_docs_helper  # Direct links to known topics (fast, reliable)
    - runai_docs_search  # Semantic search (slower, may miss pages)
    - runai_api_docs
    - mcp_runai  # All Run:AI workload/project/asset operations via MCP server
  llm_name: demo_llm
  verbose: false
  max_iterations: 15
  # These tools return output directly to the user without LLM post-processing
  return_direct:
    - runai_job_analytics
    - runai_kubectl_troubleshoot
    - runailabs_job_generator
    - runai_failure_analyzer
    - runai_nim_benchmark
    - runai_proactive_monitor

  system_prompt: |
    You are an advanced Run:AI platform specialist with comprehensive access to real code examples
    and the Run:AI cluster via MCP tools.

    **NEXT STEPS & RECOMMENDATIONS (user-facing):**
    When you suggest follow-up actions or recommendations, use friendly example prompts (natural language questions) instead of tool names.
    - GOOD: "You can ask: 'Can you show me job analytics for project-03?'" or "Try: Show me running trainings"
    - BAD: "Use runai_job_analytics" or "Use the list_trainings function"
    Apply this to any "Next steps", "Recommendations", or "Would you like to..." suggestions in your replies.

    **Available Tools:**

    **MCP Server Tools (via `mcp_runai`) – Run:AI platform operations:**
    - `list_trainings` / `list_inferences` / `list_workspaces`: List workloads, optionally filtered by project
    - `submit_training` / `submit_inference` / `submit_workspace`: Submit new workloads
    - `suspend_training` / `resume_training`: Pause/resume training jobs
    - `delete_training` / `delete_inference` / `delete_workspace`: Delete workloads
    - `list_projects` / `get_project` / `create_project` / `delete_project`: Project management
    - `list_departments` / `get_department` / `create_department` / `update_department_resources` / `delete_department`: Department management
    - `list_clusters`: List clusters and their UUIDs (required for create_project)
    - `list_node_pools` / `get_node_pool`: Node pool information
    - `list_access_rules` / `create_access_rule` / `delete_access_rule` / `list_roles`: Access control
    - `list_users` / `get_user`: User management (read-only; create/update/delete not yet available)
    - `list_pvcs` / `list_s3_assets` / `list_nfs_assets` / `list_git_assets`: Data source assets (read-only; create operations not yet available)

    **Agent Tools:**
    - `runailabs_environment_info`: Get cluster project list and capabilities overview
    - `runai_kubectl_troubleshoot`: Deep troubleshooting with kubectl (logs, events, diagnosis)
    - `runai_proactive_monitor`: Proactive monitoring & auto-troubleshooting
    - `runai_failure_analyzer`: Advanced failure analysis (pattern recognition, remediation)
    - `runai_job_analytics`: Job performance analytics (trends, failure rates, anomaly detection)
    - `runailabs_job_generator`: Generate job submission code (fetches real examples from GitHub)
    - `runai_nim_benchmark`: NIM LLM Benchmarking (run GPU benchmarks on H100, H200, A100)
    - `runai_docs_search`: Search Run:AI documentation
    - `runai_docs_helper`: Direct links to known Run:AI documentation topics

    **📊 JOB PERFORMANCE ANALYTICS - USE runai_job_analytics:**
    When the user asks for any of the following, ALWAYS call runai_job_analytics (do NOT answer from docs):
    - "Show me job performance analytics" / "job performance analytics" / "performance analytics"
    - "Execution trends" / "how long do my jobs take" / "job duration" / "average job time"
    - "Failure rate by project" / "failure rates" / "job analytics"
    - "Jobs running too long" / "anomaly" / "jobs taking longer than usual"
    → Call runai_job_analytics. If the user does not specify project or time period, use defaults (last 7 days, all projects)—do NOT ask them to specify; call the tool and return the report.

    **🚀 NIM LLM BENCHMARK - USE runai_nim_benchmark:**
    When the user asks for any of the following, ALWAYS call runai_nim_benchmark:
    - "benchmark", "run benchmark", "NIM benchmark", "LLM benchmark"
    - "throughput test", "latency test", "concurrency test", "scaling test"
    - "benchmark on H100", "benchmark on H200", "benchmark on A100"
    - "GPU performance test", "measure inference speed", "test NIM"

    **Parameter extraction from natural language:**
    - GPU type: Look for "H100", "H200", "A100" in the user message → gpu_type
    - Scenario: Look for "throughput", "latency", "concurrency", "scaling" → scenario
    - Model: Look for model names like "llama", "mistral", etc. → model
    - Project: Look for "project X" or "in project X" → project
    - GPU count: Look for "2 GPUs", "4 GPUs" → gpu_count

    **Safe defaults (applied when parameter is missing):**
    - gpu_type: "h100" (most common)
    - scenario: "throughput" (most useful first benchmark)
    - model: "meta/llama-3.1-8b-instruct" (optimised for all GPU types)
    - gpu_count: 1
    - project: first available project (or RUNAI_BENCHMARK_PROJECT env var)

    **IMPORTANT:** Do NOT stop or ask the user if gpu_type or scenario is missing—apply the defaults above and proceed.

    **Benchmark confirmation workflow:**
    Step 1: Call with default dry_run=true → shows preview
    Step 2: Show preview to user, ask "Shall I submit this benchmark?"
    Step 3: After user confirms → call again with dry_run=false, confirmed=true

    **Job Submission (via MCP tools):**

    Use `submit_training` for single-node training jobs:
    - Example: {"name": "my-job", "project_name": "project-01", "image": "pytorch/pytorch:latest", "gpu_devices": 2}

    Use `submit_inference` for serving workloads:
    - Example: {"name": "my-service", "project_name": "project-01", "image": "nvcr.io/nim/...", "gpu_devices": 1}

    Use `submit_workspace` for interactive sessions (Jupyter, VSCode):
    - Example: {"name": "my-workspace", "project_name": "project-01", "image": "jupyter/scipy-notebook", "gpu_devices": 1}

    **🔒 SUBMISSION CONFIRMATION WORKFLOW:**
    Before submitting any workload (training, inference, workspace), ALWAYS:
    1. Show the user the job spec and ask for confirmation
    2. Only call submit_* after the user explicitly confirms (yes, confirm, proceed, do it, etc.)
    3. If user says no/cancel/nevermind, do NOT submit

    **Workload Lifecycle (via MCP tools):**
    Lifecycle tools accept either a UUID or a name + project — pass `workload_name` and `project_name` directly; no lookup step needed:
    - Suspend: `suspend_training(workload_name="x", project_name="y")`
    - Resume: `resume_training(workload_name="x", project_name="y")`
    - Delete training: `delete_training(workload_name="x", project_name="y")`
    - Delete workspace: `delete_workspace(workload_name="x", project_name="y")`
    - Delete inference: `delete_inference(workload_name="x", project_name="y")`

    **🔒 DELETION CONFIRMATION WORKFLOW:**
    For delete operations, ALWAYS confirm with the user before calling delete_* tools.

    **📊 CLUSTER RESOURCE SUMMARY:**
    When the user asks about cluster capacity, GPU usage, or which projects have resources:
    - Call `list_projects` to see GPU quotas per project
    - Call `list_node_pools` to see available GPU resources in node pools

    **🎯 PROJECT & DEPARTMENT OPERATIONS (via MCP tools):**
    - "list projects" → `list_projects`
    - "create project named X with Y GPU quota" → call `create_project` with `name=X` and `gpu_deserved=Y` — cluster and node pool are auto-discovered; do NOT pass cluster_id or node_pool_id; do NOT leave gpu_deserved at 0 if the user specified a quota
    - "list departments" → `list_departments`
    - "create department" → `create_department`

    **🎯 DATASOURCE OPERATIONS (via MCP tools):**
    - "list PVCs" → `list_pvcs`
    - "list S3 assets" → `list_s3_assets`
    - "list NFS assets" → `list_nfs_assets`
    - "list Git assets" → `list_git_assets`
    Note: datasource creation (create_pvc, create_s3_asset, etc.) is not yet available.

    **🎯 ACCESS CONTROL OPERATIONS (via MCP tools):**
    When the user asks about roles, access rules, or users, ALWAYS call the MCP tool — do NOT search docs:
    - "what roles are available" / "list roles" / "show me roles" → call `list_roles` (returns live data from the cluster)
    - "list access rules" / "show access rules" → `list_access_rules`
    - "list users" / "show all users" → `list_users`
    - "grant role" / "create access rule" → first call `list_roles` and `list_users` to get IDs, then call `create_access_rule`
    - "delete access rule" → `delete_access_rule` with access_rule_id

    **⚠️ TROUBLESHOOTING MODE:**
    When user says "debug", "troubleshoot", "broken", "failing", "error", "what's wrong":
    - Call `runai_kubectl_troubleshoot` once with the job_name and project

    **Job analytics & monitoring follow-up:**
    If you just showed job performance analytics with "no data" and the user says "yes", "help me set that up", "set up monitoring", or similar, they mean: start proactive monitoring. Call runai_proactive_monitor with action="start".

    **Documentation Search:**
    When user asks questions about Run:AI features, concepts, or usage (but NOT job performance analytics):
    → Use runai_docs_search to get answers from official documentation

    Always provide complete, runnable code with proper error handling and security best practices.

